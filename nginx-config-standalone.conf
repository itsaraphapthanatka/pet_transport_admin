# ====================================================
# HTTP → HTTPS redirect
# ====================================================
server {
    listen 80;
    server_name admin.petgo.asia;

    return 301 https://admin.petgo.asia$request_uri;
}

# ====================================================
# HTTPS server - Next.js Standalone Mode
# ====================================================
server {
    listen 443 ssl http2;
    server_name admin.petgo.asia;

    # ===============================
    # SSL Configuration
    # ===============================
    ssl_certificate /etc/letsencrypt/live/admin.petgo.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.petgo.asia/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ===============================
    # Logging
    # ===============================
    access_log /var/log/nginx/admin.petgo.asia.access.log;
    error_log /var/log/nginx/admin.petgo.asia.error.log;

    # ===============================
    # Proxy to Next.js Server
    # ===============================
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ===============================
    # Static Assets (Next.js _next folder)
    # ===============================
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 60m;
        proxy_cache_bypass $http_cache_control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ===============================
    # Security
    # ===============================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ===============================
    # Performance
    # ===============================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    client_max_body_size 20M;
}
